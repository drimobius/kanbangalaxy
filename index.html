<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KTMEX Kanban Challenge - Mobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { --arcade-blue: #00aaff; --arcade-yellow: #f4d03f; --arcade-red: #ff4444; }
        body { margin: 0; padding: 0; background: #1a1a1a; color: white; font-family: 'Press Start 2P', cursive; display: flex; flex-direction: column; align-items: center; overflow: hidden; touch-action: none; }
        
        #game-view { 
            position: relative; width: 98vw; max-width: 800px; aspect-ratio: 16 / 9; 
            margin-top: 10px; border: 4px solid #444; background: #2c3e50;
            background-size: cover; background-position: center; overflow: hidden;
        }

        #ui-layer { position: absolute; top: 0; width: 100%; display: flex; justify-content: space-between; padding: 10px; box-sizing: border-box; background: rgba(0, 0, 0, 0.7); z-index: 100; font-size: 10px; }
        #mailbox { position: absolute; bottom: 5%; right: 5%; width: 25%; max-width: 100px; aspect-ratio: 1; background: url('mailbox.png') no-repeat center/contain; z-index: 10; transition: transform 0.1s; }
        
        .kanban-card { position: absolute; width: 20%; max-width: 80px; aspect-ratio: 1.6/1; background: url('kanban.png') no-repeat center/contain; touch-action: none; z-index: 50; }
        
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 200; text-align: center; }
        input { padding: 10px; font-family: 'Press Start 2P'; font-size: 14px; width: 80%; border: 4px solid var(--arcade-blue); background: #000; color: #fff; text-align: center; }
        button { padding: 15px 25px; font-family: 'Press Start 2P'; background: var(--arcade-blue); color: white; border: none; margin-top: 20px; font-size: 12px; }
        
        #leaderboard-area { width: 95vw; max-width: 800px; background: #222; border: 2px solid var(--arcade-blue); padding: 10px; margin-top: 10px; }
        table { width: 100%; font-size: 9px; }
        
        @media (max-width: 600px) {
            #ui-layer { font-size: 8px; }
            h2 { font-size: 14px; }
        }
        .panic-mode { border-color: var(--arcade-red) !important; box-shadow: 0 0 10px rgba(255, 68, 68, 0.5); }
    </style>
</head>
<body>

    <h2 style="color: var(--arcade-blue); margin: 5px;">KANBAN GALAXY</h2>
    <div id="game-view">
        <div id="ui-layer">
            <div>ID: <span id="id-tag">---</span></div>
            <div>SC: <span id="score">0</span></div>
            <div>T: <span id="timer">60</span>s</div>
        </div>
        <div id="mailbox"></div>
        <div id="start-screen" class="screen">
            <h1 style="font-size: 16px;">NUEVA PARTIDA</h1>
            <input type="number" id="emp-id" placeholder="ID">
            <button id="btn-start">INICIAR</button>
        </div>
        <div id="end-screen" class="screen" style="display:none;">
            <h1>¡TIEMPO!</h1>
            <p id="final-pts"></p>
            <button onclick="location.reload()">REINTENTAR</button>
        </div>
    </div>

    <div id="leaderboard-area">
        <h3 style="text-align: center; font-size: 10px;">TOP 3 KTMEXOS</h3>
        <table><tbody id="lb-data"></tbody></table>
    </div>

    <script>
        // Lógica del juego integrada (adaptada para táctil)
        let score = 0, timeLeft = 60, gameActive = false, isPanicMode = false;
        const view = document.getElementById('game-view');

        function spawnKanban() {
            if(!gameActive) return;
            const card = document.createElement('div');
            card.className = 'kanban-card';
            card.style.left = (Math.random() * 70) + "%";
            card.style.top = (Math.random() * 50 + 20) + "%";

            let isDragging = false;
            const move = (x, y) => {
                const rect = view.getBoundingClientRect();
                card.style.left = (x - rect.left - 40) + 'px';
                card.style.top = (y - rect.top - 25) + 'px';
            };

            const end = () => {
                isDragging = false;
                const cRect = card.getBoundingClientRect();
                const mRect = document.getElementById('mailbox').getBoundingClientRect();
                if(cRect.right > mRect.left && cRect.left < mRect.right && cRect.bottom > mRect.top && cRect.top < mRect.bottom) {
                    score += 100;
                    document.getElementById('score').innerText = score;
                    card.remove();
                    spawnKanban();
                }
            };

            card.addEventListener('mousedown', () => isDragging = true);
            card.addEventListener('touchstart', (e) => { e.preventDefault(); isDragging = true; }, {passive: false});
            document.addEventListener('mousemove', (e) => { if(isDragging) move(e.clientX, e.clientY); });
            document.addEventListener('touchmove', (e) => { if(isDragging) { e.preventDefault(); move(e.touches[0].clientX, e.touches[0].clientY); }}, {passive: false});
            document.addEventListener('mouseup', end);
            document.addEventListener('touchend', end);
            view.appendChild(card);
        }

        document.getElementById('btn-start').onclick = () => {
            const val = document.getElementById('emp-id').value;
            if(val.length < 1) return;
            document.getElementById('id-tag').innerText = val;
            document.getElementById('start-screen').style.display = 'none';
            gameActive = true;
            spawnKanban();
            let timer = setInterval(() => {
                if(timeLeft-- <= 0) { clearInterval(timer); gameActive = false; alert("Fin: " + score); }
                document.getElementById('timer').innerText = timeLeft;
            }, 1000);
        };
    </script>
</body>
</html>
